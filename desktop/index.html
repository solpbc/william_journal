<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theatre of Memory — William's desktop, 1595</title>
<link rel="stylesheet" href="base.css">
<style>
:root {
  --night: #0b1530; --gold: #c9a24a; --gold2: #e8cd85; --brass: #a8843c; --wood: #3b2414;
  --paper: #efe6cf; --paper2: #f7f0de; --ink: #1d1914; --muted: #6e6250; --accent: #1f3a6e; --rule: rgba(60,45,25,.25); --hl: rgba(201,162,74,.22);
  --f-body: "Garamond", Georgia, serif; --f-head: "Cinzel", serif; --f-hand: "Garamond", Georgia, serif; --f-caps: "Cinzel", serif;
}
body { background: radial-gradient(ellipse at 50% 100%, #1b3266 0%, #0d1a3a 45%, #060b1a 100%); font-family: var(--f-body); color: var(--gold2); }
#sky { position: fixed; inset: 0; z-index: 0; }
.astro { position: fixed; top: 14px; right: 18px; z-index: 2; text-align: center; width: 190px; cursor: pointer; }
.astro svg { width: 128px; height: 128px; }
.astro .w { font-style: italic; font-size: 14px; color: rgba(232,205,133,.85); line-height: 1.25; }
#theatre { position: fixed; inset: 0; z-index: 1; }
#theatre .wedge { cursor: pointer; }
#theatre .wedge path.fill { fill: rgba(201,162,74,.035); stroke: rgba(201,162,74,.45); stroke-width: 1; transition: fill .2s; }
#theatre .wedge:hover path.fill { fill: rgba(201,162,74,.14); }
#theatre .wedge.open path.fill { fill: rgba(201,162,74,.08); }
#theatre .wedge .med { fill: #0f1c3d; stroke: var(--gold); stroke-width: 1.5; }
#theatre .wedge:hover .med { fill: #1a2c5c; }
#theatre .wedge .lbl { font-family: "Cinzel"; font-size: 13px; letter-spacing: .14em; fill: var(--gold2); text-anchor: middle; }
#theatre .wedge .pl { font-size: 18px; fill: var(--gold); text-anchor: middle; font-family: "DejaVu Sans", sans-serif; }
#theatre .wedge .god { font-family: "Garamond"; font-style: italic; font-size: 13px; fill: rgba(232,205,133,.6); text-anchor: middle; }
#theatre .tier { fill: none; stroke: rgba(201,162,74,.18); stroke-width: 1; }
#theatre .stage { fill: #08112a; stroke: var(--gold); stroke-width: 1.5; }
#theatre .apron { stroke: var(--sky-line); stroke-width: 1; }
#theatre .stagelbl { pointer-events: none; font-family: "Cinzel"; font-size: 11px; letter-spacing: .4em; fill: rgba(201,162,74,.55); text-anchor: middle; }

/* footlights */
.lights { pointer-events: none; position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; gap: 10px; max-width: 250px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.lamp { pointer-events: auto; background: none; border: none; display: flex; min-width: 24px; white-space: nowrap; flex-direction: column; align-items: center; gap: 2px; color: rgba(232,205,133,.7); font-family: var(--f-head); font-size: 10px; letter-spacing: .12em; padding: 0; }
.lamp .nm { font-family: "DejaVu Sans", var(--f-head); font-size: 10px; }
.lamp .flame { width: 12px; height: 18px; background: radial-gradient(ellipse at 50% 70%, #fff3c4, #f0b440 45%, rgba(240,120,40,0) 70%); border-radius: 50% 50% 45% 45%; filter: blur(.3px); animation: flick 1.6s infinite alternate; }
.lamp .cup { width: 20px; height: 6px; background: linear-gradient(var(--gold2), var(--brass)); border-radius: 0 0 10px 10px; }
.lamp.min .flame { opacity: .35; animation: none; transform: scale(.7); }
.lamp.active { color: var(--gold2); }
.lamp.active .flame { transform: scale(1.3); }
@keyframes flick { to { transform: scale(1.08, .94) translateY(1px); } }


#desk { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; }
#desk > * { pointer-events: auto; }

/* windows: cabinet panels */
.win { padding: 0 10px 10px; border-radius: 3px;
  background: repeating-linear-gradient(92deg, rgba(0,0,0,.08) 0 2px, transparent 2px 7px), linear-gradient(160deg, #5a3820, #3b2414 50%, #2a180c);
  box-shadow: 0 0 0 1px #1a0e06, 0 0 0 2px rgba(201,162,74,.5), 0 20px 50px rgba(0,0,0,.6); }
.win:not(.active) { filter: brightness(.82) saturate(.8); }
.win.active { box-shadow: 0 0 0 1px #1a0e06, 0 0 0 2px var(--gold), 0 0 30px rgba(201,162,74,.18), 0 24px 60px rgba(0,0,0,.7); }
.stud { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f3dc98, #8a6a28 70%); z-index: 3; }
.stud.a { left: 3px; top: 3px; } .stud.b { right: 3px; top: 3px; } .stud.c { left: 3px; bottom: 3px; } .stud.d { right: 3px; bottom: 3px; }
.cab { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 10px; user-select: none; cursor: grab; flex: none; }
.dragging .cab { cursor: grabbing; }
.cab .pl { font-size: 18px; color: var(--gold); font-family: "DejaVu Sans", sans-serif; }
.cab .t { font-family: var(--f-head); font-weight: 600; letter-spacing: .2em; font-size: 14px; color: var(--gold2); text-shadow: 0 1px 0 rgba(0,0,0,.6); white-space: nowrap; }
.cab .s { font-style: italic; font-size: 13px; color: rgba(232,205,133,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.knobs { display: flex; gap: 7px; }
.knob { width: 18px; height: 18px; border-radius: 50%; border: none; padding: 0; font-size: 9px; color: #3a2a10; background: radial-gradient(circle at 35% 30%, #f6e2a4, #a8843c 65%, #6e5420); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.knob:hover { filter: brightness(1.15); }
.win .wbody { background: var(--paper); border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4), inset 0 2px 8px rgba(80,50,20,.25); color: var(--ink); }
.grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 4; }
.opening { animation: doors .38s cubic-bezier(.2,.7,.2,1); }
@keyframes doors { from { clip-path: inset(0 50% 0 50%); opacity: .4; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.closing { animation: shut .26s ease-in forwards; }
@keyframes shut { to { clip-path: inset(0 50% 0 50%); opacity: .3; } }

/* theatre app touches */
.page { font-size: 18.5px; font-style: italic; }
.page .sp { font-family: var(--f-caps); font-style: normal; font-size: 13px; letter-spacing: .1em; color: var(--accent); }
.seal-btn { background: var(--accent); font-family: var(--f-caps); letter-spacing: .1em; font-size: 12px; }
.app button.small, .app .tool, .app .nav { font-family: var(--f-caps); font-size: 11.5px; letter-spacing: .06em; border-color: rgba(60,45,25,.4); }
.wheel-page h2, .cp-list h2, .thread-head b, .alm-title b, .bundle-view h3 { font-weight: 500; letter-spacing: .06em; color: var(--accent); }
.ledger-title { font-family: var(--f-caps); font-size: 14px; letter-spacing: .1em; }
.letter p, .cp-list blockquote p { font-style: italic; }
.bill b { font-family: "Fraktur"; }
.alm-grid .day.today { outline-color: var(--gold); background: rgba(201,162,74,.12); }
.tp-t { color: var(--accent); }

/* herald */
.herald { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 99999; min-width: 320px; text-align: center; padding: 10px 28px 12px; cursor: pointer; background: #0f1c3d; border: 1px solid var(--gold); box-shadow: 0 0 0 4px #0f1c3d, 0 0 0 5px rgba(201,162,74,.5), 0 12px 30px rgba(0,0,0,.6); animation: herald .4s ease-out; }
.herald b { display: block; font-family: var(--f-head); letter-spacing: .25em; font-size: 14px; color: var(--gold2); }
.herald span { font-style: italic; color: rgba(232,205,133,.85); }
.herald.out { opacity: 0; transition: opacity .6s; }
@keyframes herald { from { transform: translate(-50%, -20px); opacity: 0; } }

/* the stage overview: every cabinet brought down, shrunk and set apart */
#theatre .stage { cursor: pointer; transition: fill .2s; }
#theatre .stage:hover { fill: #10204a; }
.scrim { position: fixed; inset: 0; z-index: 2; background: rgba(4,8,20,.62); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.overview .scrim { opacity: 1; pointer-events: auto; }
body.overview .astro { opacity: .35; transition: opacity .3s; }
.win.ov-anim { transition: transform .38s cubic-bezier(.2,.8,.2,1), filter .3s; }
.win.ov { cursor: pointer; filter: none !important; }
.win.ov * { pointer-events: none; }
.win.ov:hover { box-shadow: 0 0 0 1px #1a0e06, 0 0 0 3px var(--gold2), 0 0 40px rgba(232,205,133,.35), 0 24px 60px rgba(0,0,0,.7); }
.win.ov.ov-folded { filter: brightness(.55) saturate(.6) !important; }
.win.ov.ov-folded:hover { filter: none !important; }
.ov-label { position: fixed; z-index: 9000; transform: translateX(-50%); font-family: var(--f-head); letter-spacing: .2em; font-size: 12px; color: var(--gold2); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s .15s; text-shadow: 0 1px 3px #000; }
body.overview .ov-label { opacity: 1; }
.ov-label i { font-style: normal; font-family: "DejaVu Sans", sans-serif; margin-right: 6px; color: var(--gold); }
.ov-label em { font-family: var(--f-body); letter-spacing: 0; font-size: 12px; opacity: .7; margin-left: 6px; }

/* the sky follows the hour: night, dawn, the painted day, dusk */
body { --sky-line: rgba(201,162,74,.45); --sky-tier: rgba(201,162,74,.18); --sky-lbl: #e8cd85; --sky-lbl2: rgba(232,205,133,.6); --sky-fill: rgba(201,162,74,.035); --sky-fillh: rgba(201,162,74,.14); --sky-title: var(--gold); transition: background .8s; }
body.sky-day { background: linear-gradient(#35619e 0%, #6f98cc 50%, #b9d0ea 100%); --sky-line: rgba(255,246,220,.82); --sky-tier: rgba(255,246,220,.32); --sky-lbl: #fffaf0; --sky-lbl2: rgba(255,250,236,.92); --sky-fill: rgba(255,250,236,.07); --sky-fillh: rgba(255,250,236,.22); --sky-title: #fff4d6; }
body.sky-dawn { background: linear-gradient(#18244f 0%, #4b4f86 42%, #c98f7e 78%, #f0c091 100%); --sky-line: rgba(255,236,200,.7); --sky-tier: rgba(255,236,200,.28); --sky-lbl: #fff1d8; --sky-lbl2: rgba(255,241,216,.85); --sky-fill: rgba(255,236,200,.05); --sky-fillh: rgba(255,236,200,.18); --sky-title: #f6dca2; }
body.sky-dusk { background: linear-gradient(#141b46 0%, #4a3f78 42%, #c27a63 80%, #e3a272 100%); --sky-line: rgba(255,228,190,.7); --sky-tier: rgba(255,228,190,.28); --sky-lbl: #fff0d6; --sky-lbl2: rgba(255,240,214,.85); --sky-fill: rgba(255,228,190,.05); --sky-fillh: rgba(255,228,190,.18); --sky-title: #f6d79a; }
#theatre .wedge path.fill { fill: var(--sky-fill); stroke: var(--sky-line); }
#theatre .wedge:hover path.fill { fill: var(--sky-fillh); }
#theatre .tier { stroke: var(--sky-tier); }
#theatre .wedge .lbl { fill: var(--sky-lbl); }
#theatre .wedge .god { fill: var(--sky-lbl2); }
body:not(.sky-night) #theatre .lbl, body:not(.sky-night) #theatre .god { font-weight: 600; }
.title b { color: var(--sky-title); }
.astro .w { color: var(--sky-lbl2); }
body:not(.sky-night) .astro .w { text-shadow: 0 1px 3px rgba(15,28,61,.6); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="astro" id="astrow" title="the almanack"><svg viewBox="0 0 128 128" id="astro"></svg><div class="w" id="when"></div></div>
<svg id="theatre"></svg>
<main id="desk"></main>
<div class="scrim" id="scrim"></div>
<div class="lights" id="lights"></div>
<script src="data.js"></script>
<script src="feed.js"></script>
<script src="stage.js"></script>
<script src="core.js"></script>
<script>
const { createOS, glyph, time, h, bus, letters, roman } = OS1595;
// Camillo's gangways, by the planets, and an eighth for the sphere of the fixed stars
const PLANETS = [
  ["coffer", "☽", "Luna"], ["letters", "☿", "Mercurius"], ["commonplace", "♀", "Venus"], ["almanac", "☉", "Sol"],
  ["papers", "♂", "Mars"], ["wheel", "♃", "Iupiter"], ["accounts", "♄", "Saturnus"], ["glass", "✶", "Stellatum"]];
const MED = {};
const PL = Object.fromEntries(PLANETS.map(p => [p[0], p]));
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.append(e); return e; };

const env = {
  root: document.getElementById("desk"),
  frame(w) {
    const p = PL[w.app.id];
    const el = h("section", {},
      h("i", { class: "stud a" }), h("i", { class: "stud b" }), h("i", { class: "stud c" }), h("i", { class: "stud d" }),
      h("div", { class: "cab", "data-drag": "" }, h("span", { class: "pl" }, p[1]), h("span", { class: "t" }, w.app.title.toUpperCase()), h("span", { class: "s", "data-subtitle": "" }, w.app.sub),
        h("span", { class: "knobs" }, h("button", { class: "knob", title: "close the doors, leave it lit", "data-min": "" }, ""), h("button", { class: "knob", title: "open the cabinet wide", "data-max": "" }, ""), h("button", { class: "knob", title: "put out the lamp", "data-close": "" }, "✕"))),
      h("div", { class: "wbody" }), h("div", { class: "grip", "data-resize": "" }));
    return { el, body: el.querySelector(".wbody") };
  },
  place(app, n, R) {
    const sc = window.W1595.scene, [w, hh] = app.size;
    if (sc && (sc.front === app.id || sc.behind === app.id)) {
      const W = Math.min(w + 40, R.width - 440), H = Math.min(hh + 20, R.height - 190);
      return sc.front === app.id ? { x: (R.width - W) / 2 + 70, y: 92, w: W, h: H } : { x: (R.width - W) / 2 - 150, y: 46, w: W, h: H };
    } const W = Math.min(w, R.width - 480), H = Math.min(hh, R.height - 170);
    const x = (R.width - W) / 2 + (n % 4 - 1.5) * 46, y = 60 + (n % 4) * 26;
    return { x: Math.max(250, Math.min(R.width - W - 220, x)), y, w: W, h: H };
  },
  maxRect(R) { return { x: 250, y: 50, w: R.width - 470, h: R.height - 120 }; },
  opened(w) { if (!window.W1595.scene) fly(w, true); },
  restoring(w) { fly(w, true); },
  minimizing(w, done) { fly(w, false).then(done); },
  closing(w, done) { fly(w, false, true).then(done); },
  onChange: drawState,
  notice(n, os) {
    const p = PL[n.app] || ["", "✦"];
    const el = h("div", { class: "herald", onclick: () => { if (n.app) os.open(n.app, n.arg); el.remove(); } }, h("b", {}, p[1] + "  " + n.title.toUpperCase() + "  " + p[1]), h("span", {}, n.body));
    document.body.append(el); setTimeout(() => el.classList.add("out"), 6500); setTimeout(() => el.remove(), 7100);
  }
};
const os = createOS(env);

/* the sun over London (lat 51.5): Julian 1595 runs ten days behind the sun's calendar */
function sunTimes(d) {
  const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5) + 10;
  const decl = 23.44 * Math.sin(2 * Math.PI * (284 + doy) / 365) * Math.PI / 180, lat = 51.5 * Math.PI / 180;
  const ha = Math.acos(Math.max(-1, Math.min(1, -Math.tan(lat) * Math.tan(decl)))) * 180 / Math.PI / 15;
  return { rise: 12 - ha, set: 12 + ha };
}
function skyPhase(d = time.now()) {
  const { rise, set } = sunTimes(d), hr = d.getHours() + d.getMinutes() / 60;
  if (Math.abs(hr - rise) < .75) return "dawn"; if (Math.abs(hr - set) < .75) return "dusk";
  return hr > rise && hr < set ? "day" : "night";
}
/* the sky: deterministic stars by night, the sun by day */
function sky() {
  const d = time.now(), ph = skyPhase(d), { rise, set } = sunTimes(d), hr = d.getHours() + d.getMinutes() / 60;
  ["night", "dawn", "day", "dusk"].forEach(p => document.body.classList.toggle("sky-" + p, p === ph));
  const c = document.getElementById("sky"), W = c.width = innerWidth, H = c.height = innerHeight, g = c.getContext("2d");
  const starA = { night: 1, dawn: .3, dusk: .35, day: 0 }[ph];
  let seed = 1595; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 420; i++) { const x = r() * W, y = r() * H * .8, m = r(); if (!starA || (ph !== "night" && y > H * .4)) continue; g.fillStyle = `rgba(255,${235 + m * 20 | 0},${200 + m * 40 | 0},${(.25 + m * .65) * starA})`; g.beginPath(); g.arc(x, y, m > .97 ? 1.6 : m * 1.05 + .2, 0, 7); g.fill(); }
  if (ph !== "night") {
    const f = Math.max(-.04, Math.min(1.04, (hr - rise) / (set - rise)));
    const x = W * (.1 + .8 * f), y = H * .7 - Math.sin(Math.PI * Math.max(0, Math.min(1, f))) * H * .52;
    const glow = g.createRadialGradient(x, y, 4, x, y, 140); glow.addColorStop(0, "rgba(255,244,200,.85)"); glow.addColorStop(.25, "rgba(255,226,150,.35)"); glow.addColorStop(1, "rgba(255,226,150,0)");
    g.fillStyle = glow; g.beginPath(); g.arc(x, y, 140, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,236,170,.75)"; g.lineWidth = 1.4;
    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r1 = 26, r2 = i % 2 ? 40 : 52; g.beginPath(); g.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); g.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); g.stroke(); }
    g.fillStyle = "#fff1bd"; g.beginPath(); g.arc(x, y, 20, 0, 7); g.fill();
  }
}
/* the theatre */
function theatre() {
  const svg = document.getElementById("theatre"), W = innerWidth, H = innerHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.replaceChildren();
  const cx = W / 2, cy = H - 34, r0 = 150, r1 = Math.min(W * .43, H * .64);
  const P = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  [r0 + (r1 - r0) * .36, r0 + (r1 - r0) * .7].forEach(r => s("path", { class: "tier", d: `M${P(r, Math.PI)} A${r} ${r} 0 0 1 ${P(r, 2 * Math.PI)}` }, svg));
  PLANETS.forEach(([id, sym, god], i) => {
    const n = PLANETS.length, a0 = Math.PI + i * Math.PI / n, a1 = a0 + Math.PI / n, am = (a0 + a1) / 2;
    const g = s("g", { class: "wedge", "data-app": id }, svg);
    g.addEventListener("click", () => os.open(id));
    s("path", { class: "fill", d: `M${P(r0, a0)} L${P(r1, a0)} A${r1} ${r1} 0 0 1 ${P(r1, a1)} L${P(r0, a1)} A${r0} ${r0} 0 0 0 ${P(r0, a0)}Z` }, g);
    const rm = r0 + (r1 - r0) * .62, [mx, my] = P(rm, am);
    MED[id] = [mx, my];
    s("circle", { class: "med", cx: mx, cy: my, r: 30 }, g);
    const gl = s("g", { transform: `translate(${mx - 17} ${my - 17}) scale(.71)`, color: "#e8cd85" }, g); gl.innerHTML = glyph(id).replace(/<svg[^>]*>|<\/svg>/g, "");
    gl.setAttribute("fill", "none"); gl.setAttribute("stroke", "currentColor"); gl.setAttribute("stroke-width", "2"); gl.setAttribute("stroke-linecap", "round"); gl.setAttribute("stroke-linejoin", "round");
    const t = s("text", { class: "pl", x: mx, y: my - 40 }, g); t.textContent = sym;
    const l = s("text", { class: "lbl", x: mx, y: my + 48 }, g); l.textContent = os.apps[id].title.toUpperCase();
    const gd = s("text", { class: "god", x: mx, y: my + 64, "data-state": id }, g); gd.textContent = god;
  });
  s("path", { class: "stage", d: `M${P(r0 - 12, Math.PI)} A${r0 - 12} ${r0 - 12} 0 0 1 ${P(r0 - 12, 2 * Math.PI)}Z` }, svg);
  svg.querySelector(".stage").addEventListener("click", () => overview ? leaveOverview() : enterOverview());
  s("path", { class: "apron", d: `M0 ${cy} H${W}` }, svg);
  const sl = s("text", { class: "stagelbl", x: cx, y: cy - 62 }, svg); sl.textContent = "THE STAGE";
  drawState();
}
/* a cabinet comes out of its own gangway, and folds back into it */
function fly(w, opening, closing) {
  const m = MED[w.app.id]; if (!m || !w.el.animate) return Promise.resolve();
  const r = w.el.getBoundingClientRect(), dx = m[0] - (r.left + r.width / 2), dy = m[1] - (r.top + r.height / 2);
  const small = { transform: `translate(${dx}px, ${dy}px) scale(.06)`, opacity: closing ? 0 : .2 }, full = { transform: "none", opacity: 1 };
  return w.el.animate(opening ? [small, full] : [full, small], { duration: opening ? 380 : 300, easing: opening ? "cubic-bezier(.2,.8,.2,1)" : "cubic-bezier(.5,0,.8,.4)", fill: opening ? "none" : "forwards" })
    .finished.then(a => { if (!opening) requestAnimationFrame(() => w.el.getAnimations().forEach(x => x.cancel())); });
}
/* what each gangway shows of its cabinet, live */
function gangState(id) {
  const D = window.W1595, now = time.now();
  try {
    if (id === "papers") { const c = os.store.get("papers:cur", null), sh = D.sheets.find(x => x.id === c) || D.sheets[0]; return sh ? sh.title : ""; }
    if (id === "wheel") { const w = [...os.wins.values()].find(x => x.app.id === "wheel"); const h2 = w && w.el.querySelector(".wheel-page h2"); return h2 ? h2.textContent : "Paul's Church-yard"; }
    if (id === "letters") { const n = letters.unreadCount(); if (n) return n === 1 ? "a letter unread" : roman(n) + " letters unread"; const nx = (D.carrierDays || []).find(d => d >= time.iso(now)); return nx ? "the carrier, " + (nx === time.iso(now) ? "today" : time.WEEKDAY[new Date(nx + "T12:00").getDay()] + " " + roman(+nx.slice(8))) : ""; }
    if (id === "accounts") { const r = os.ledger.rows().filter(x => x.note !== "count"); const l = r[r.length - 1]; return l ? l.item.replace(/^Item,?\s*/i, "").slice(0, 30) + (l.paid || l.rec ? " · " + os.lsd.fmt(l.paid || l.rec) : "") : ""; }
    if (id === "almanac") { const ev = ((D.marks || {})[time.iso(now)] || []).concat(D.almanac[time.iso(now)] || []); return ev[0] || ""; }
    if (id === "commonplace") { const it = os.store.get("commonplace", D.commonplace).filter(x => x.text); const l = it[it.length - 1]; return l ? l.head : ""; }
    if (id === "coffer") return os.store.get("coffer:open", false) ? "both locks turned" : "two locks";
    if (id === "glass") return OS1595.glassState() || "";
  } catch (e) { return ""; }
  return "";
}
function drawGangs() {
  document.querySelectorAll("#theatre [data-state]").forEach(t => { const v = gangState(t.dataset.state); t.textContent = v.length > 30 ? v.slice(0, 29) + "…" : v; });
}
/* footlights */
function drawState() {
  const wins = [...os.wins.values()];
  document.querySelectorAll("#theatre .wedge").forEach(g => g.classList.toggle("open", wins.some(w => w.app.id === g.dataset.app)));
  const lights = document.getElementById("lights");
  lights.replaceChildren(...wins.map(w => h("button", { class: "lamp" + (w.minimized ? " min" : "") + (os.active === w ? " active" : ""), title: w.app.title, onclick: () => { if (overview) return leaveOverview(w); if (os.active === w && !w.minimized) os.minimize(w); else os.restore(w); } },
    h("span", { class: "flame" }), h("span", { class: "cup" }), h("span", { class: "nm" }, PL[w.app.id][1] + (os.active === w ? " " + w.app.title.replace(/^The /, "").split(" ")[0].toUpperCase() : "") + (w.app.id === "letters" && letters.unreadCount() ? " •" : "")))));
  drawGangs();
}
bus.on("letters", drawState); bus.on("ledger", drawGangs); bus.on("coffer", drawGangs); bus.on("glass", drawGangs);
document.getElementById("astrow").addEventListener("click", () => os.open("almanac"));

/* the astronomical dial: XXIIII hours (noone at the top, midnight below), the sun's hand, the moon's face */
function astro() {
  const d = time.now(), svg = document.getElementById("astro"); svg.replaceChildren();
  const A = H => (H / 24) * 2 * Math.PI + Math.PI / 2, pt = (H, r) => `${64 + Math.cos(A(H)) * r} ${64 + Math.sin(A(H)) * r}`;
  s("circle", { cx: 64, cy: 64, r: 60, fill: "#0f1c3d", stroke: "#c9a24a", "stroke-width": 1.5 }, svg);
  // night, from sunset about v to sunrise about vij in late October
  const st = sunTimes(d); s("path", { d: `M64 64 L${pt(st.set, 46)} A46 46 0 ${(24 - st.set + st.rise) > 12 ? 1 : 0} 1 ${pt(st.rise, 46)} Z`, fill: "rgba(3,6,16,.7)" }, svg);
  s("circle", { cx: 64, cy: 64, r: 46, fill: "none", stroke: "rgba(201,162,74,.5)" }, svg);
  for (let i = 0; i < 24; i++) {
    const [x, y] = pt(i, 53).split(" ").map(Number);
    const t = s("text", { x, y: y + 2.4, "font-size": 6.3, fill: "#e8cd85", "text-anchor": "middle", "font-family": "Cinzel" }, svg);
    t.textContent = roman(i % 12 || 12).toUpperCase().replace(/J$/, "I");
  }
  const hrs = d.getHours() + d.getMinutes() / 60;
  s("line", { x1: 64, y1: 64, x2: pt(hrs, 44).split(" ")[0], y2: pt(hrs, 44).split(" ")[1], stroke: "#e8cd85", "stroke-width": 2 }, svg);
  const [sx, sy] = pt(hrs, 38).split(" "); s("circle", { cx: sx, cy: sy, r: 5, fill: "#e8cd85" }, svg);
  // the moon: lit disc, then the shadow bounded by the terminator
  const ph = time.moon(d), rx = Math.abs(13 * Math.cos(ph * 2 * Math.PI));
  s("circle", { cx: 64, cy: 64, r: 13, fill: "#e8e0c4" }, svg);
  const wax = ph < .5, s1 = wax ? 0 : 1, s2 = wax ? (ph < .25 ? 0 : 1) : (ph > .75 ? 1 : 0);
  s("path", { d: `M64 51 A13 13 0 0 ${s1} 64 77 A${rx} 13 0 0 ${s2} 64 51 Z`, fill: "#0b1530" }, svg);
  s("circle", { cx: 64, cy: 64, r: 13, fill: "none", stroke: "#c9a24a", "stroke-width": .8 }, svg);
  const word = ph < .06 || ph > .97 ? "the moone is new" : Math.abs(ph - .5) < .03 ? "the moone is full" : ph < .5 ? "the moone waxeth" : "the moone waneth";
  document.getElementById("when").innerHTML = `${time.dateWords(d)}<br>${time.hourWords(d)}<br><span style="opacity:.6">${word}</span>`;
}

/* the stage: touch it and every cabinet comes down onto the boards, shrunk and set apart */
let overview = false, ovLabels = [];
async function enterOverview() {
  await Promise.all([...os.wins.values()].flatMap(w => w.el.getAnimations().map(a => a.finished.catch(() => {}))));
  await new Promise(r => requestAnimationFrame(r));
  const ord = id => PLANETS.findIndex(p => p[0] === id);
  const ws = [...os.wins.values()].sort((a, b) => ord(a.app.id) - ord(b.app.id));
  if (!ws.length || overview) return;
  overview = true; document.body.classList.add("overview");
  const R = { x: 230, y: 150, w: innerWidth - 460, h: innerHeight - 360 };
  const n = ws.length, cols = Math.min(n, Math.max(1, Math.round(Math.sqrt(n * (R.w / R.h) / 1.5)))), rows = Math.ceil(n / cols);
  const cw = R.w / cols, ch = R.h / rows;
  ws.forEach((w, i) => {
    const el = w.el, row = Math.floor(i / cols), inRow = row === rows - 1 ? n - row * cols : cols, col = i - row * cols;
    if (w.minimized) { el.classList.remove("minimized"); el.classList.add("ov-folded"); }
    const ow = el.offsetWidth, oh = el.offsetHeight, ol = el.offsetLeft, ot = el.offsetTop;
    const sc = Math.min((cw - 36) / ow, (ch - 46) / oh, .9);
    const cx = R.x + (R.w - inRow * cw) / 2 + cw * (col + .5), cy = R.y + ch * (row + .5) - 10;
    el.classList.add("ov-anim", "ov");
    el.style.transformOrigin = "50% 50%";
    requestAnimationFrame(() => { el.style.transform = `translate(${cx - (ol + ow / 2)}px, ${cy - (ot + oh / 2)}px) scale(${sc})`; });
    const lb = h("div", { class: "ov-label", style: `left:${cx}px; top:${cy + oh * sc / 2 + 10}px` }, h("i", {}, PL[w.app.id][1]), w.app.title.toUpperCase(), w.subtitle ? h("em", {}, w.subtitle) : null, w.minimized ? h("em", {}, "· doors closed") : null);
    document.body.append(lb); ovLabels.push(lb);
    el._ovPick = e => { e.preventDefault(); e.stopPropagation(); leaveOverview(w); };
    el.addEventListener("click", el._ovPick, true);
  });
}
function leaveOverview(pick) {
  if (!overview) return;
  overview = false; document.body.classList.remove("overview");
  ovLabels.forEach(l => l.remove()); ovLabels = [];
  [...os.wins.values()].forEach(w => {
    const el = w.el; el.removeEventListener("click", el._ovPick, true);
    el.classList.remove("ov"); el.style.transform = "";
    setTimeout(() => {
      el.classList.remove("ov-anim");
      if (el.classList.contains("ov-folded")) { el.classList.remove("ov-folded"); if (w !== pick) el.classList.add("minimized"); }
    }, 400);
  });
  if (pick) { if (pick.minimized) os.restore(pick); else os.focus(pick); }
}
document.getElementById("scrim").addEventListener("click", () => leaveOverview());
addEventListener("keydown", e => {
  if (e.key === "Escape" && overview) leaveOverview();
  if (e.key === "F3" || (e.key === "`" && !e.target.closest("input,textarea,[contenteditable]"))) { e.preventDefault(); overview ? leaveOverview() : enterOverview(); }
});
sky(); theatre(); astro();
setInterval(() => { astro(); drawGangs(); if (skyPhase() !== (document.body.className.match(/sky-(\w+)/) || [])[1]) sky(); }, 15000);
addEventListener("resize", () => { sky(); theatre(); });
os.boot(["papers"]);
</script>
